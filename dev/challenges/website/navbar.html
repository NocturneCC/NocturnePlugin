  toggle.setAttribute('aria-label', 'Menu');

  var mobileLinks = [

    { href: '/leaderboards.html', label: 'Nocturne Challenges' },

    { href: '/gwars-home.html', label: 'Gielinor Wars' },
    { href: '/admin.html', label: 'Admin' }

  var mobileMenu = document.createElement('div');
  mobileMenu.id = 'nocturne-nav-mobile';
  mobileMenu.innerHTML = mobileLinks.map(function(l) {
    return '<a href="' + l.href + '">' + l.label + '</a>';

  var navEl = document.querySelector('.navbar');

})();
