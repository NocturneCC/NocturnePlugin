# Insert inside the existing nocturne.events HTTPS server block, before the
# catch-all /api/ location. Authentication is enforced again by the app.
location = /api/challenges/intake/approved {
    limit_except POST {
        deny all;
    }

    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_request_buffering on;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 15s;

    proxy_pass http://127.0.0.1:5011/api/challenges/intake/approved;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Client-safe RuneLite observations. The API revalidates the active published
# Challenge policy on every request; this endpoint accepts no privileged token.
location = /api/challenges/intake/observations {
    limit_except POST {
        deny all;
    }

    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_request_buffering on;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 15s;

    proxy_pass http://127.0.0.1:5011/api/challenges/intake/observations;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
