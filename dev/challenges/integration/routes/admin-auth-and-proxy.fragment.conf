# Bounded route excerpts from /etc/nginx/sites-enabled/nocturne at adoption;
# compared with the pinned full-file source hash in source-manifest.json.
# These fragments require the existing server-level Cottus auth subrequest
# definitions and variables; they are documentation/source artifacts, not a
# standalone Nginx file and must not be installed independently.

# Root-level HTML page gate used by /challenge-admin.html (lines 275-297).
location ~ ^/[^/]+\.html$ {
    if ($is_link_crawler) {
        return 200 '<!DOCTYPE html><html><head>
<meta property="og:title" content="Nocturne">
<meta property="og:description" content="Nocturne OSRS Clan">
<meta property="og:image" content="https://nocturne.events/media/noct-logo.png">
<meta property="og:image:width" content="1920">
<meta property="og:image:height" content="1080">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://nocturne.events/media/noct-logo.png">
<meta property="og:url" content="$scheme://$host$request_uri">
</head><body></body></html>';
        add_header Content-Type text/html;
    }

    auth_request /internal-verify-page;
    auth_request_set $required_role $upstream_http_x_required_role;
    error_page 401 = @need_login;
    error_page 403 = @forbidden;
    try_files $uri =404;
}

# Authenticated admin proxy used by the page's /admin/api/challenges/* calls
# (lines 379-405).
location /admin/ {
    client_max_body_size 6M;
    auth_request /internal-verify-discord-session;
    error_page 401 = @need_login;
    auth_request_set $discord_id       $upstream_http_x_discord_id;
    auth_request_set $discord_username $upstream_http_x_discord_username;
    auth_request_set $discord_roles    $upstream_http_x_nocturne_roles;
    proxy_pass http://127.0.0.1:5003/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Discord-ID $discord_id;
    proxy_set_header X-Discord-Username $discord_username;
    proxy_set_header X-Nocturne-Roles $discord_roles;
}
