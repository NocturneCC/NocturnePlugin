# Public Nocturne clan announcements. Add inside the existing HTTPS server.
location = /api/plugin/v1/announcements {
    limit_except GET { deny all; }
    limit_req zone=nocturne_plugin_dev_ip burst=5 nodelay;
    limit_req zone=nocturne_plugin_dev_total burst=10 nodelay;
    limit_req_status 429;
    if ($content_length !~ "^$|^0$") { return 413; }
    if ($http_transfer_encoding != "") { return 413; }
    client_body_timeout 2s;
    client_max_body_size 1;
    proxy_request_buffering on;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 7s;
    proxy_buffering on;
    proxy_intercept_errors off;
    proxy_hide_header Set-Cookie;
    proxy_pass_header ETag;
    proxy_pass_header Cache-Control;
    proxy_pass http://127.0.0.1:5072;
}
