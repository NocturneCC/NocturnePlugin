# Add inside the EXISTING nocturne.events HTTPS server block.
location = /api/plugin/dev/drops {
    limit_req zone=nocturne_plugin_dev_ip burst=5 nodelay;
    limit_req zone=nocturne_plugin_dev_total burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_request_buffering on;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 12s;
    proxy_pass http://127.0.0.1:5072;
}
